name: Release

# Bumps the user-facing app version on every merge into main, tags it, and
# builds an installable APK on EAS.
#
# The bump is the whole point: EAS auto-increments android.versionCode and
# ios.buildNumber for us (eas.json: appVersionSource remote + autoIncrement),
# but it never touches the semver in app.json. Without this workflow that number
# is frozen at whatever it was last hand-edited to, and every store release
# claims to be the same version.
#
# Order matters, and it is why the build job checks out a tag rather than the
# commit that triggered the run. The bump is pushed *after* this workflow
# starts, so a default checkout would build the version before the one this run
# just released — an APK labelled 1.3.0 produced by the run that released 1.4.0.
#
# Loop safety. This workflow pushes to the branch that triggers it, which is
# normally how you build an infinite loop. It cannot happen here: pushes
# authenticated with the built-in GITHUB_TOKEN do not trigger workflow runs.
# `[skip ci]` in the bump commit message is a second, independent guard, and the
# `if:` on the version job is a third — one of them holding is enough.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'Which part of the version to bump'
        type: choice
        default: minor
        options: [major, minor, patch]
      build:
        description: 'Also build on EAS after bumping'
        type: boolean
        default: true
      profile:
        description: 'EAS build profile'
        type: choice
        default: production-apk
        options: [production-apk, preview, production]

# One release at a time. Two concurrent runs would each compute the next version
# from the same starting point, and the loser's push would be rejected.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Never version code that does not build. Reuses ci.yml rather than repeating
  # its steps, so the checks that gate a release cannot drift from the checks
  # that gate a pull request.
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    needs: checks
    runs-on: ubuntu-latest
    # Skip our own bump commits, and give humans an opt-out for merges that
    # should not produce a new version (docs, CI tweaks, reverts).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip version]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed so the push below fails loudly on a collision
          # instead of silently doing nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: node scripts/bump-version.mjs ${{ inputs.level || 'minor' }}

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app.json package.json
          git commit -m "chore(release): v${VERSION} [skip ci]" \
                     -m "Bumped from v${PREVIOUS} by .github/workflows/release.yml."
          git tag -a "${TAG}" -m "v${VERSION}"

          # Atomic: the commit and the tag land together or neither does, so a
          # tag can never point at a version that is not on main.
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          echo "### Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bumped from \`v${PREVIOUS}\`. EAS assigns the Android versionCode" \
               "and iOS buildNumber at build time." >> "$GITHUB_STEP_SUMMARY"

  # Builds an installable APK for every released version.
  #
  # Android only, and deliberately: an APK is an Android artefact, and the iOS
  # half of `eas.json`'s submit config is still REPLACE_WITH_* placeholders, so
  # `--platform all` would queue an iOS build that cannot finish. Add it here
  # when there is an Apple Developer account behind it.
  #
  # `production-apk` extends `production`, so it inherits autoIncrement and the
  # production EAS environment; it differs only in emitting an APK rather than
  # the AAB the Play Store wants. That is the artefact you can actually install
  # on a phone, which is the point of building on every merge while nothing has
  # been validated on hardware yet.
  #
  # A merge tagged `[skip version]` produces no version and therefore no build:
  # the `version` job skips, and this one needs it.
  build:
    needs: version
    # Every merge to main. Manual runs still opt in, so a dispatch used only to
    # bump does not spend a build.
    if: github.event_name == 'push' || inputs.build
    runs-on: ubuntu-latest
    # An EAS build waits in a queue before it runs. This is the ceiling on both
    # together — high enough not to fire on a slow queue, finite so a wedged
    # build does not hold a runner all day.
    timeout-minutes: 90
    steps:
      # Fail here, with instructions, rather than several minutes later inside
      # `eas build` with an authentication error that does not say what to do.
      # Same reasoning as the credential check in app.config.js.
      # Checked through `env` rather than `if: !secrets.EXPO_TOKEN`, because the
      # `secrets` context is not available to an `if:` expression — that form
      # parses and then silently evaluates to false, so the guard never fires
      # and the build fails later anyway, which is the failure it exists to
      # prevent.
      - name: Require an Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not set."
            echo "Create a token at https://expo.dev/settings/access-tokens, then add it as"
            echo "a repository secret named EXPO_TOKEN under"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The bump commit was pushed after this workflow started, so the
          # default checkout would build the *previous* version.
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Waits for the build rather than returning once it is queued. A
      # fire-and-forget build cannot fail this workflow, so a broken release
      # would look identical to a good one until somebody opened expo.dev — and
      # the reason to build on every merge is to find out.
      #
      # Credentials are NOT passed from here. app.config.js fails a production
      # build outright when EXPO_PUBLIC_SUPABASE_* are missing from the EAS
      # environment, which is where they belong; putting them in this workflow
      # would produce an APK that installs and cannot sign anybody in.
      - name: EAS build
        id: eas
        env:
          PROFILE: ${{ inputs.profile || 'production-apk' }}
        run: |
          set -euo pipefail
          eas build --platform android --profile "$PROFILE" --non-interactive --json \
            | tee eas-build.json

      # Separate, and tolerant: the APK exists whether or not this can parse the
      # JSON, so a shape change in the CLI output must not fail a green build.
      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PROFILE: ${{ inputs.profile || 'production-apk' }}
        run: |
          {
            echo "### APK · v${VERSION} · \`${PROFILE}\`"
            echo ""
            node -e '
              const fs = require("fs");
              try {
                const raw = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
                const build = Array.isArray(raw) ? raw[0] : raw;
                const url = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
                console.log(url ? `[Download the APK](${url})` : "Build finished; no artefact URL in the CLI output.");
                if (build?.id) console.log(`\nBuild \`${build.id}\` — https://expo.dev/accounts/_/builds/${build.id}`);
              } catch {
                console.log("Build output could not be read — see the EAS build step above, or expo.dev.");
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept for 90 days, so a link in the run outlives the EAS retention window
      # on the free plan.
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-${{ needs.version.outputs.version }}
          path: eas-build.json
          if-no-files-found: ignore
